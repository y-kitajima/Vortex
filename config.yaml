# =============================================================================
# 設定ファイル
# =============================================================================
#
# このファイルは「どのRSSフィードを・どんな名前で扱うか」を定義します。
# YAML（ヤムル）形式で書かれており、インデント（字下げ）が構造を表します。
# タブではなく「半角スペース2つ」で揃えてください。
#
# 変更したら保存して、reader.py を再実行すれば反映されます。
# =============================================================================

# --- フィードの一覧 ---
# 各フィードには「ラベル（表示名）」と「URL」のセットを指定します。
# ここに好きなだけ追加できます。
feeds:
  - label: "Gigazine"
    url: "https://gigazine.net/news/rss_2.0/"

  - label: "Publickey"
    url: "https://www.publickey1.jp/atom.xml"

  - label: "ITmedia"
    url: "https://rss.itmedia.co.jp/rss/2.0/topstory.xml"
